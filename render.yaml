services:
  - type: web
    name: 9router-tele-bot
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/data
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: INITIAL_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ROUTER_API_KEY
        value: ""
      - key: DEFAULT_MODEL
        value: ""
      - key: ALLOWED_TELEGRAM_IDS
        value: ""
